name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Backend test
        working-directory: backend
        run: mvn -B test

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com/farmwise/farmwise-backend:latest
            crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com/farmwise/farmwise-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com/farmwise/farmwise-frontend:latest
            crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com/farmwise/farmwise-frontend:${{ github.sha }}

      - name: Build and push simulator image
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          push: ${{ github.event_name == 'push' }}
          tags: |
            crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com/farmwise/farmwise-simulator:latest
            crpi-6qnp9vn9wop3xsyi.cn-huhehaote.personal.cr.aliyuncs.com/farmwise/farmwise-simulator:${{ github.sha }}

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          key_file="$RUNNER_TEMP/farmwise_cd_key"
          known_hosts_file="$RUNNER_TEMP/farmwise_known_hosts"

          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 644 "$known_hosts_file"

          ssh \
            -i "$key_file" \
            -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n /usr/local/sbin/farmwise-deploy'
