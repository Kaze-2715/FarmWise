spring:
  application:
    name: farmwise-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/farmwise_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:farmwise}
    password: ${DB_PASSWORD:farmwise}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:deepseek-v4-flash}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${SERVER_PORT:8080}

farmwise:
  security:
    jwt:
      issuer: farmwise
      access-token-ttl: 15m
      secret: ${JWT_SECRET}
    refresh-token:
      ttl: 30d
      cookie-name: farmwise_refresh_token
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
  file:
    storage:
      local:
        root-directory: ${FILE_STORAGE_ROOT:./data/uploads}

  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:farmwise-backend-local}
    telemetry-topic: ${MQTT_TELEMETRY_TOPIC:farmwise/v1/devices/+/telemetry}
    status-topic: ${MQTT_STATUS_TOPIC:farmwise/v1/devices/+/status}
    command-topic: ${MQTT_COMMAND_TOPIC:farmwise/v1/devices/%s/commands}
    command-ack-topic: ${MQTT_COMMAND_ACK_TOPIC:farmwise/v1/devices/+/command-acks}
    qos: ${MQTT_QOS:1}
    connection-timeout-seconds: ${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
    offline-timeout-seconds: ${MQTT_OFFLINE_TIMEOUT_SECONDS:60}
    offline-scan-interval-milliseconds: ${MQTT_OFFLINE_SCAN_INTERVAL_MILLISECONDS:30000}
    keep-alive-seconds: ${MQTT_KEEP_ALIVE_SECONDS:30}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
